<section class="section services-section" id="servicos" aria-labelledby="services-title">
  <div class="section-inner">
    <div class="section-heading services-heading">
      <div>
        <p class="eyebrow">MADEIRARTE <span>/</span> 04 · SOB MEDIDA</p>
        <h2 id="services-title">Nossos serviços</h2>
      </div>
      <div class="carousel-controls">
        <button type="button" aria-label="Serviços anteriores" (click)="moveServices(-1)">←</button>
        <button type="button" aria-label="Próximos serviços" (click)="moveServices(1)">→</button>
      </div>
    </div>
    <div class="service-grid">
      @for (service of visibleServices; track service.title; let index = $index) {
        <article class="service-card">
          <a class="service-image" href="#contato" [attr.aria-label]="'Conversar sobre ' + service.title">
            <img [src]="service.image" [alt]="service.title + ' — imagem demonstrativa'" loading="lazy">
            <span class="service-image-label">IMAGEM DEMONSTRATIVA</span>
            <span class="service-number">{{ serviceNumber(index) }} <span>/ 07</span></span>
          </a>
          <div class="service-copy">
            <h3>{{ service.title }}</h3>
            <p>{{ service.description }}</p>
            <a class="text-link" href="#contato">Saiba mais <span aria-hidden="true">↗</span></a>
          </div>
        </article>
      }
    </div>
  </div>
</section>
